# Glances: CPU / memory / load / containers / network of the box itself, for Home Assistant (glances integration) and Homepage.
# Web UI + REST API v4 on :61208 (LAN). network_mode: host (Nov 13 2026) so the network plugin sees the real
# interfaces (wlp0s20f3, tailscale0) instead of a container NIC; pid: host so it sees every host process.
# Docker stats come through a dedicated read-only socket proxy published on loopback only (127.0.0.1:2376),
# because a host-network container can't resolve 'socket-proxy' on the media network.
# No /data, /mnt/mig/* or host-root mount: the fs plugin only sees the container's own mounts. No state to back up.
services:
  glances:
    image: nicolargo/glances:4.5.9-full
    container_name: glances
    restart: unless-stopped
    pid: host
    network_mode: host
    depends_on: [glances-socket-proxy]
    environment:
      TZ: Region/City
      GLANCES_OPT: "-w"
      DOCKER_HOST: tcp://127.0.0.1:2376
    volumes:
      - /etc/os-release:/etc/os-release:ro

  glances-socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: glances-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/run"]
    ports: ["127.0.0.1:2376:2375"]
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

x-lsio: &lsio
  restart: unless-stopped
  networks: [media]

x-env: &env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}
  UMASK: "002"

services:
  sabnzbd:
    <<: *lsio
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment: *env
    ports: ["8080:8080"]
    volumes:
      - /opt/media/config/sabnzbd:/config
      - /data/usenet:/data/usenet
      - /scratch/sabnzbd:/scratch/sabnzbd

  prowlarr:
    <<: *lsio
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *env
    ports: ["9696:9696"]
    volumes:
      - /opt/media/config/prowlarr:/config

  sonarr:
    <<: *lsio
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *env
    ports: ["8989:8989"]
    volumes:
      - /opt/media/config/sonarr:/config
      - /data:/data

  radarr:
    <<: *lsio
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *env
    ports: ["7878:7878"]
    volumes:
      - /opt/media/config/radarr:/config
      - /data:/data

  bazarr:
    <<: *lsio
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: *env
    ports: ["6767:6767"]
    volumes:
      - /opt/media/config/bazarr:/config
      - /data/media:/data/media

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    networks: [media]
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      CRON_SCHEDULE: "0 4 * * *"
    volumes:
      - /opt/media/config/recyclarr:/config

networks:
  media:
    external: true

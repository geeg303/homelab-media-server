# TEMPORARY (migration in progress): strips all /data mounts. Remove this file + COMPOSE_FILE line in .env when /data (mergerfs) is live.
services:
  tdarr:
    volumes: !override
      - /opt/media/config/tdarr/server:/app/server
      - /opt/media/config/tdarr/configs:/app/configs
      - /opt/media/config/tdarr/logs:/app/logs
      - /scratch/tdarr:/scratch/tdarr
      - /mnt/disk1/media/tv:/media/disk1/tv:ro   # 4K run (Nov 9): read-only; tdarr-swap does the replacing
  tdarr-node:
    volumes: !override
      - /opt/media/config/tdarr/node-configs:/app/configs
      - /opt/media/config/tdarr/node-logs:/app/logs
      - /scratch/tdarr:/scratch/tdarr
      - /mnt/disk1/media/tv:/media/disk1/tv:ro   # 4K run (Nov 9): read-only; tdarr-swap does the replacing

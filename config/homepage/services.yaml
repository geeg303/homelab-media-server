# Homepage services — 90s redesign (Nov 13 2026). Tabs/groups: see settings.yaml layout.
# Secrets come from /opt/media/stacks/ops/homepage.env as {{HOMEPAGE_VAR_*}}.
# Plex native widget is LIVE (un-parked Nov 13 2026 once real libraries existed: TV Shows = section 1, Movies = section 2).
#   It talks to Plex directly (http://192.0.2.242:32400, {{HOMEPAGE_VAR_PLEX_TOKEN}}); extra library detail comes from Tautulli get_library.
- Today on the Box:
  - The Box (host):
      href: "http://192.0.2.242:61208"
      icon: mdi-server
      description: "user's Ubuntu server: uptime, load, RAM, containers, Tailscale, nightly config backup"
      widget:
        type: customapi
        url: "http://status/host.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: uptime
          label: Uptime
        - field: load
          label: Load (1/5/15 min)
        - field: memory
          label: Memory
        - field: containers
          label: Containers
        - field: failed_units
          label: Failed services
        - field: tailscale
          label: Tailscale
        - field: backup_last
          label: Last config backup
        - field: updated
          label: Updated
  - Disk migration:
      href: /#jobs
      target: _self
      icon: mdi-harddisk-plus
      description: NTFS → ext4 move of the media drives, one disk per round (full details on the Jobs page)
      widget:
        type: customapi
        url: "http://status/migration.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: round
          label: Round
        - field: stage
          label: Now
        - field: overall_bar
          label: Overall
        - field: eta
          label: ETA
        - field: rounds
          label: Rounds
  - Uptime Kuma:
      href: "http://192.0.2.242:3001/status/box"
      icon: uptime-kuma.png
      description: watches every app, disk and job; pings ntfy when something breaks
      widget:
        type: uptimekuma
        url: "http://uptime-kuma:3001"
        slug: box
        fields:
        - up
        - down
        - uptime
        - incident
  - Storage at a glance:
      href: /#server-room
      target: _self
      icon: mdi-database
      description: how full the new ext4 data disks are
      widget:
        type: customapi
        url: "http://status/disks.json"
        refreshInterval: 120000
        display: list
        mappings:
        - field: array_total
          label: Data disks
        - field: disk1
          label: disk1
        - field: disk3
          label: disk3
        - field: scratch
          label: scratch
        - field: root
          label: OS
  - Tdarr conversions:
      href: /#jobs
      target: _self
      icon: tdarr.png
      description: shrinks videos to HEVC with the Intel GPU (paused during the migration)
      widget:
        type: customapi
        url: "http://status/tdarr.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: now
          label: Now
        - field: totals
          label: Totals
        - field: saved
          label: Saved
        - field: swap
          label: Library
  - Container updates:
      href: "http://192.0.2.242:3002"
      icon: whats-up-docker.png
      description: "What's Up Docker: new image versions waiting (applied by docker-update-all)"
      widget:
        type: whatsupdocker
        url: "http://wud:3000"
        username: "{{HOMEPAGE_VAR_WUD_USER}}"
        password: "{{HOMEPAGE_VAR_WUD_PASSWORD}}"
        fields:
        - monitoring
        - updates
- Media Mania:
  - Plex:
      href: "http://192.0.2.242:32400/web"
      icon: plex.png
      description: The big kahuna of the home theater! Plex streams every movie & show on the box to any TV, phone or browser, like a video store that never closes and never charges late fees. Live
        streams and the shelf count (movies, shows, episodes) show right here.
      server: box
      container: plex
      showStats: true
      siteMonitor: "http://192.0.2.242:32400/identity"
      widgets:
      - type: plex
        url: "http://192.0.2.242:32400"
        key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
        fields:
        - streams
        - movies
        - tv
        - albums
      - type: customapi
        url: "http://tautulli:8181/api/v2?cmd=get_library&section_id=1&apikey={{HOMEPAGE_VAR_TAUTULLI_KEY}}"
        refreshInterval: 900000
        mappings:
        - field: response.data.count
          label: Shows
          format: number
        - field: response.data.parent_count
          label: Seasons
          format: number
        - field: response.data.child_count
          label: Episodes
          format: number
  - Tautulli:
      href: "http://192.0.2.242:8181"
      icon: tautulli.png
      description: Plex's nosy neighbor with a clipboard. Tautulli watches who's streaming what, logs every play, and keeps the box's viewing high-score table. Live streams show right here.
      server: box
      container: tautulli
      showStats: true
      siteMonitor: "http://192.0.2.242:8181"
      widgets:
      - type: tautulli
        url: "http://tautulli:8181"
        key: "{{HOMEPAGE_VAR_TAUTULLI_KEY}}"
        enableUser: true
        showEpisodeNumber: true
        expandOneStreamToTwoRows: true
      - type: customapi
        url: "http://tautulli:8181/api/v2?cmd=get_server_info&apikey={{HOMEPAGE_VAR_TAUTULLI_KEY}}"
        refreshInterval: 300000
        display: list
        mappings:
        - field: response.data.pms_name
          label: Plex server
        - field: response.data.pms_version
          label: Plex version
        - field: response.data.pms_platform
          label: Platform
        - field: response.data.pms_plexpass
          label: Plex Pass
          remap:
          - value: 1
            to: ★ YES ★
          - any: true
            to: 'no'
      - type: customapi
        url: "http://tautulli:8181/api/v2?cmd=get_history&length=1&apikey={{HOMEPAGE_VAR_TAUTULLI_KEY}}"
        refreshInterval: 300000
        mappings:
        - field: response.data.recordsTotal
          label: Plays logged
          format: number
        - field: response.data.total_duration
          label: Time watched
  - Seerr:
      href: "http://192.0.2.242:5055"
      icon: overseerr.png
      description: The request hotline! Friends & family browse, click "Request", and Seerr hands the order to Sonarr/Radarr. Like calling in to the radio station, but the DJ actually plays it.
      server: box
      container: seerr
      showStats: true
      siteMonitor: "http://192.0.2.242:5055"
      widgets:
      - type: seerr
        url: "http://seerr:5055"
        key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
        fields:
        - pending
        - approved
        - processing
        - completed
      - type: seerr
        url: "http://seerr:5055"
        key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
        fields:
        - available
        - issues
      - type: customapi
        url: "http://seerr:5055/api/v1/status"
        refreshInterval: 3600000
        mappings:
        - field: version
          label: Version
        - field: updateAvailable
          label: Update?
          remap:
          - value: true
            to: NEW!
          - any: true
            to: up to date
        - field: commitsBehind
          label: Behind
          format: number
  - Maintainerr:
      href: "http://192.0.2.242:6246"
      icon: maintainerr.png
      description: The janitor of the media library. Maintainerr follows your rules ("nobody watched it in a year?") to gather stale stuff into leaving-soon collections, then sweeps it out to free disk.
      server: box
      container: maintainerr
      showStats: true
      siteMonitor: "http://192.0.2.242:6246"
      widgets:
      - type: maintainerr
        url: "http://maintainerr:6246"
        fields:
        - itemsHandled
        - moviesHandled
        - showsHandled
      - type: maintainerr
        url: "http://maintainerr:6246"
        fields:
        - seasonsHandled
        - episodesHandled
        - totalCapacity
      - type: maintainerr
        url: "http://maintainerr:6246"
        fields:
        - reclaimable
        - movieReclaimable
        - showReclaimable
      - type: customapi
        url: "http://maintainerr:6246/api/app/status"
        refreshInterval: 3600000
        mappings:
        - field: version
          label: Version
        - field: updateAvailable
          label: Update?
          remap:
          - value: true
            to: NEW!
          - any: true
            to: up to date
  - Kometa:
      href: "http://192.0.2.242:5001"
      icon: kometa.png
      description: "The poster artist. No web page of its own: every morning at 05:00 Kometa (ex Plex Meta Manager) builds collections (\"80s Action!\", \"Oscar Winners\") and paints rating badges on the\
        \ posters. Logs live in Dockge (this link)."
      server: box
      container: kometa
      showStats: true
  - Live TV (PrismCast):
      href: "http://192.0.2.242:5589"
      icon: mdi-television-classic
      description: Cable TV, Y2K-style! PrismCast drives a hidden Chrome that plays YouTube TV channels and pretends to be an HDHomeRun tuner, so Plex sees real live channels and a guide. 2 tuners = 2 channels
        at once.
      server: box
      container: prismcast
      showStats: true
      widget:
        type: customapi
        url: "http://192.0.2.242:5589/health"
        refreshInterval: 15000
        display: list
        mappings:
        - field: status
          label: Status
          remap:
          - value: healthy
            to: ✔ healthy
          - any: true
            to: ✖ trouble
        - field: streams.active
          label: Streams on air
          format: number
          additionalField:
            field: streams.limit
            color: theme
        - field: clients.total
          label: Viewers
          format: number
        - field: browser.connected
          label: Chrome
          remap:
          - value: true
            to: connected
          - any: true
            to: DISCONNECTED
          additionalField:
            field: chrome
            color: theme
        - field: browser.captureImpaired
          label: Capture
          remap:
          - value: false
            to: OK
          - any: true
            to: impaired
          additionalField:
            field: captureMode
            color: theme
        - field: ffmpegAvailable
          label: ffmpeg
          remap:
          - value: true
            to: ready
          - any: true
            to: missing
        - field: memory.rss
          label: Memory
          format: bytes
        - field: uptime
          label: Uptime
          format: duration
        - field: version
          label: PrismCast
  - HDHomeRun tuner (PrismCast):
      href: "http://192.0.2.242:5004/discover.json"
      icon: mdi-antenna
      description: "The fake rabbit-ears. This is the HDHomeRun-compatible tuner PrismCast shows to Plex (Live TV & DVR > add device > 192.0.2.242:5004). Channel count comes from its lineup."
      server: box
      container: prismcast
      showStats: false
      widgets:
      - type: customapi
        url: "http://192.0.2.242:5004/discover.json"
        refreshInterval: 300000
        display: list
        mappings:
        - field: FriendlyName
          label: Tuner
        - field: TunerCount
          label: Tuners
          format: number
        - field: ModelNumber
          label: Model
          additionalField:
            field: FirmwareVersion
            color: theme
        - field: DeviceID
          label: Device ID
      - type: customapi
        url: "http://192.0.2.242:5004/lineup.json"
        refreshInterval: 900000
        mappings:
        - label: Channels
          format: size
  - PrismCast browser (VNC):
      href: "http://192.0.2.242:6080/vnc.html?autoconnect=1&resize=scale"
      icon: mdi-monitor-screenshot
      description: "Peek behind the curtain: noVNC remote screen of PrismCast's Chrome, for logging in to the streaming accounts (password in livetv.env). Look, don't break!"
      server: box
      container: prismcast
      siteMonitor: "http://192.0.2.242:6080/vnc.html"
- Download-O-Rama:
  - SABnzbd:
      href: "http://192.0.2.242:8080"
      icon: sabnzbd.png
      description: The delivery truck. SABnzbd pulls files from Usenet (Eweka), checks and repairs them, unpacks them and hands them to Sonarr/Radarr. Download speed, queue and data use below.
      server: box
      container: sabnzbd
      showStats: true
      siteMonitor: "http://192.0.2.242:8080"
      widgets:
      - type: sabnzbd
        url: "http://sabnzbd:8080"
        key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
        fields:
        - rate
        - queue
        - timeleft
      - type: customapi
        url: "http://sabnzbd:8080/api?mode=queue&limit=1&output=json&apikey={{HOMEPAGE_VAR_SABNZBD_KEY}}"
        refreshInterval: 15000
        display: list
        mappings:
        - field: queue.status
          label: State
        - field: queue.sizeleft
          label: Left to fetch
        - field: queue.diskspace1_norm
          label: Disk free
          additionalField:
            field: queue.diskspacetotal1
            color: theme
            suffix: GB total
        - field: queue.speedlimit
          label: Speed limit (%)
          remap:
          - value: '0'
            to: none, full speed
          - value: ""
            to: none, full speed
        - field: queue.version
          label: Version
      - type: customapi
        url: "http://sabnzbd:8080/api?mode=server_stats&output=json&apikey={{HOMEPAGE_VAR_SABNZBD_KEY}}"
        refreshInterval: 300000
        mappings:
        - field: day
          label: Today
          format: bytes
        - field: week
          label: Week
          format: bytes
        - field: month
          label: Month
          format: bytes
        - field: total
          label: All time
          format: bytes
  - Sonarr:
      href: "http://192.0.2.242:8989"
      icon: sonarr.png
      description: The TV butler. Sonarr keeps a list of your shows, spots new episodes the minute they air, orders them through Prowlarr + SABnzbd, then renames and files them neatly for Plex.
      server: box
      container: sonarr
      showStats: true
      siteMonitor: "http://192.0.2.242:8989"
      widgets:
      - type: sonarr
        url: "http://sonarr:8989"
        key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        fields:
        - wanted
        - queued
        - series
        enableQueue: true
      - type: customapi
        url: "http://sonarr:8989/api/v3/diskspace"
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        refreshInterval: 300000
        display: dynamic-list
        mappings:
          name: path
          label: freeSpace
          format: bytes
          suffix: free
          limit: 6
      - type: customapi
        url: "http://sonarr:8989/api/v3/health"
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        refreshInterval: 120000
        display: dynamic-list
        mappings:
          name: source
          label: type
          limit: 5
          target: "{wikiUrl}"
      - type: customapi
        url: "http://sonarr:8989/api/v3/system/status"
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        refreshInterval: 3600000
        mappings:
        - field: version
          label: Version
        - field: startTime
          label: Up since
          format: relativeDate
          style: short
          numeric: auto
  - Radarr:
      href: "http://192.0.2.242:7878"
      icon: radarr.png
      description: Sonarr's movie-buff twin. Radarr watches for films you want, grabs the best copy when it's out, upgrades it when a better one shows up, and shelves it for Plex. Be kind, rewind.
      server: box
      container: radarr
      showStats: true
      siteMonitor: "http://192.0.2.242:7878"
      widgets:
      - type: radarr
        url: "http://radarr:7878"
        key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        fields:
        - wanted
        - missing
        - queued
        - movies
        enableQueue: true
      - type: customapi
        url: "http://radarr:7878/api/v3/diskspace"
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        refreshInterval: 300000
        display: dynamic-list
        mappings:
          name: path
          label: freeSpace
          format: bytes
          suffix: free
          limit: 6
      - type: customapi
        url: "http://radarr:7878/api/v3/health"
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        refreshInterval: 120000
        display: dynamic-list
        mappings:
          name: source
          label: type
          limit: 5
          target: "{wikiUrl}"
      - type: customapi
        url: "http://radarr:7878/api/v3/system/status"
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        refreshInterval: 3600000
        mappings:
        - field: version
          label: Version
        - field: startTime
          label: Up since
          format: relativeDate
          style: short
          numeric: auto
  - Prowlarr:
      href: "http://192.0.2.242:9696"
      icon: prowlarr.png
      description: The phone book of the Usenet world. Prowlarr keeps the indexer list (NZBgeek & friends) in one place and shares it with Sonarr and Radarr, then counts every search and grab.
      server: box
      container: prowlarr
      showStats: true
      siteMonitor: "http://192.0.2.242:9696"
      widgets:
      - type: prowlarr
        url: "http://prowlarr:9696"
        key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        fields:
        - numberOfGrabs
        - numberOfQueries
        - numberOfFailGrabs
        - numberOfFailQueries
      - type: customapi
        url: "http://prowlarr:9696/api/v1/indexerstats"
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        refreshInterval: 300000
        display: dynamic-list
        mappings:
          items: indexers
          name: indexerName
          label: averageResponseTime
          format: number
          suffix: ms
          limit: 6
      - type: customapi
        url: "http://prowlarr:9696/api/v1/health"
        headers:
          X-Api-Key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        refreshInterval: 120000
        display: dynamic-list
        mappings:
          name: source
          label: type
          limit: 5
          target: "{wikiUrl}"
  - Bazarr:
      href: "http://192.0.2.242:6767"
      icon: bazarr.png
      description: The closed-caption crew. Bazarr finds and syncs subtitles for every show and movie, so you can follow along even when the dialogue is mumbled. Shows what's still missing.
      server: box
      container: bazarr
      showStats: true
      siteMonitor: "http://192.0.2.242:6767"
      widgets:
      - type: bazarr
        url: "http://bazarr:6767"
        key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
        fields:
        - missingEpisodes
        - missingMovies
      - type: customapi
        url: "http://bazarr:6767/api/badges"
        headers:
          X-API-KEY: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
        refreshInterval: 120000
        display: list
        mappings:
        - field: sonarr_signalr
          label: Sonarr link
        - field: radarr_signalr
          label: Radarr link
        - field: providers
          label: Providers throttled
          format: number
        - field: status
          label: Health issues
          format: number
        - field: announcements
          label: Announcements
          format: number
      - type: customapi
        url: "http://bazarr:6767/api/system/status"
        headers:
          X-API-KEY: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
        refreshInterval: 3600000
        mappings:
        - field: data.bazarr_version
          label: Version
        - field: data.start_time
          label: Up since
          scale: 1000
          format: relativeDate
          style: short
          numeric: auto
  - Recyclarr:
      icon: recyclarr.png
      description: "The quality-control robot. No web page: daily at 04:00 Recyclarr copies the TRaSH Guides recipes (which releases are good, which are junk) into Sonarr and Radarr automatically."
      server: box
      container: recyclarr
      showStats: true
- Coming Soon 2 a TV Near U:
  - Coming Soon (calendar):
      icon: mdi-calendar-star
      description: "TV Guide magazine, but for your box: new episodes from Sonarr and movie releases from Radarr, by the month."
      widget:
        type: calendar
        view: monthly
        firstDayInWeek: sunday
        maxEvents: 10
        showTime: true
        timezone: Region/City
        integrations:
        - type: sonarr
          service_group: Download-O-Rama
          service_name: Sonarr
          color: teal
          baseUrl: "http://192.0.2.242:8989"
          params:
            unmonitored: false
        - type: radarr
          service_group: Download-O-Rama
          service_name: Radarr
          color: amber
          baseUrl: "http://192.0.2.242:7878"
          params:
            unmonitored: false
  - Up Next (agenda):
      icon: mdi-format-list-bulleted
      description: "The same feed as a scrolling list: the last 3 days plus what's next."
      widget:
        type: calendar
        view: agenda
        maxEvents: 12
        showTime: true
        previousDays: 3
        timezone: Region/City
        integrations:
        - type: sonarr
          service_group: Download-O-Rama
          service_name: Sonarr
          color: teal
          baseUrl: "http://192.0.2.242:8989"
        - type: radarr
          service_group: Download-O-Rama
          service_name: Radarr
          color: amber
          baseUrl: "http://192.0.2.242:7878"
- Box Brain:
  - Box vitals:
      icon: mdi-desktop-tower
      description: i5-14500 · 14 cores / 20 threads · 32 GB · Ubuntu 26.04
      href: "http://192.0.2.242:61208"
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: info
        chart: false
  - CPU-O-Meter:
      icon: mdi-cpu-64-bit
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: cpu
        chart: true
        chartMin: 0
        chartMax: 100
        pointsLimit: 30
        refreshInterval: 3000
  - RAM Doubler:
      icon: mdi-memory
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: memory
        chart: true
        pointsLimit: 30
  - Load & uptime:
      icon: mdi-gauge
      description: Glances /api/4/load + quicklook (Homepage's glances widget has no load metric)
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/quicklook"
        refreshInterval: 10000
        display: list
        mappings:
        - field: cpu_name
          label: Chip
        - field: cpu_hz_current
          label: Clock now
          format: float
          scale: 1.0e-09
          suffix: GHz
        - field: load
          label: Load (of all cores)
          format: percent
        - field: cpu
          label: CPU
          format: percent
        - field: mem
          label: RAM
          format: percent
        - field: swap
          label: Swap
          format: percent
  - Load average:
      icon: mdi-chart-bell-curve-cumulative
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/load"
        refreshInterval: 10000
        mappings:
        - field: min1
          label: 1 min
          format: float
        - field: min5
          label: 5 min
          format: float
        - field: min15
          label: 15 min
          format: float
        - field: cpucore
          label: Cores
          format: number
  - Processes:
      icon: mdi-format-list-numbered
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: process
        chart: false
  - Process count:
      icon: mdi-counter
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/processcount"
        refreshInterval: 15000
        mappings:
        - field: total
          label: Procs
          format: number
        - field: running
          label: Running
          format: number
        - field: sleeping
          label: Sleeping
          format: number
        - field: thread
          label: Threads
          format: number
  - Quick Sync iGPU:
      icon: mdi-expansion-card-variant
      description: Intel GPU via Glances (mem/temp not reported; Tdarr encodes show as proc %)
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4

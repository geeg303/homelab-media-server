# Live widgets. Secrets come from /opt/media/stacks/ops/homepage.env as {{HOMEPAGE_VAR_*}} (quoted for Homepage v2).
# Widget URLs use container names on the 'media' network; Plex uses the host IP (host networking).
- Migration:
    - NTFS → ext4 migration:
        icon: mdi-harddisk-plus
        description: "live from the box, refreshes every minute"
        widget:
          type: customapi
          url: http://status/migration.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: round
              label: Round
            - field: stage
              label: Now
            - field: copy_bar
              label: Copy
            - field: verify_bar
              label: Checksum check
            - field: eta
              label: ETA
            - field: overall_bar
              label: Overall
            - field: rounds
              label: Rounds
            - field: health
              label: Health
            - field: updated
              label: Updated
    - New drives self-test:
        icon: mdi-harddisk
        description: "SMART long test, 5× WD 8 TB (second enclosure)"
        widget:
          type: customapi
          url: http://status/selftest.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: now
              label: Status
            - field: bay1
              label: Bay 1
            - field: bay2
              label: Bay 2
            - field: bay3
              label: Bay 3
            - field: bay4
              label: Bay 4
            - field: bay5
              label: Bay 5
            - field: updated
              label: Updated
- Conversions:
    - Tdarr conversions (live):
        href: "http://192.0.2.242:8265"
        icon: tdarr.png
        description: "refreshes every 30 s · verified encodes replace the originals on disk1"
        widget:
          type: customapi
          url: http://status/tdarr.json
          refreshInterval: 30000
          display: list
          mappings:
            - field: now
              label: Now
            - field: job1
              label: Job 1
            - field: job2
              label: Job 2
            - field: totals
              label: Totals
            - field: saved
              label: Saved
            - field: swap
              label: Library
            - field: workers
              label: Workers
            - field: updated
              label: Updated
- Media:
    - Plex:
        href: "http://192.0.2.242:32400/web"
        icon: plex.png
        server: box
        container: plex
        description: "no libraries until the switch-over (widget comes back then)"
        # widget parked Nov 11: Homepage's plex widget throws on an empty library list. SWITCHOVER-PLAN re-enables it.
        # widget:
        #   type: plex
        #   url: "http://192.0.2.242:32400"
        #   key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
    - Live TV (PrismCast):
        href: "http://192.0.2.242:5589"
        icon: mdi-television-classic
        description: "YouTube TV → Plex tuner · lineup cleanup pending"
        server: box
        container: prismcast
        widget:
          type: customapi
          url: http://192.0.2.242:5589/health
          refreshInterval: 30000
          mappings:
            - field: status
              label: Status
            - field:
                streams: active
              label: Streams
            - field:
                streams: limit
              label: Limit
            - field:
                clients: total
              label: Viewers
    - PrismCast browser (VNC):
        href: "http://192.0.2.242:6080/vnc.html?autoconnect=1&resize=scale"
        icon: mdi-monitor-screenshot
        description: "noVNC: PrismCast's Chrome for streaming logins (password in livetv.env)"
        server: box
        container: prismcast
        siteMonitor: "http://192.0.2.242:6080/vnc.html"
    - Tautulli:
        href: "http://192.0.2.242:8181"

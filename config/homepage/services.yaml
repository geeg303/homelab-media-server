# Live widgets. Secrets come from /opt/media/stacks/ops/homepage.env as {{HOMEPAGE_VAR_*}} (quoted for Homepage v2).
# Widget URLs use container names on the 'media' network; Plex uses the host IP (host networking).
- Migration:
    - NTFS → ext4 migration:
        icon: mdi-harddisk-plus
        description: "live from the box, refreshes every minute"
        widget:
          type: customapi
          url: http://status/migration.json
          refreshInterval: 60000
          display: list
          mappings:
            - field: round
              label: Round
            - field: stage
              label: Now
            - field: copy_bar
              label: Copy
            - field: verify_bar
              label: Checksum check
            - field: eta
              label: ETA
            - field: overall_bar
              label: Overall
            - field: rounds
              label: Rounds
            - field: health
              label: Health
            - field: updated
              label: Updated
- Conversions:
    - Tdarr conversions (live):
        href: "http://192.0.2.242:8265"
        icon: tdarr.png
        description: "refreshes every 30 s · pilot output stays in /scratch/tdarr/output"
        widget:
          type: customapi
          url: http://status/tdarr.json
          refreshInterval: 30000
          display: list
          mappings:
            - field: now
              label: Now
            - field: job1
              label: Job 1
            - field: job2
              label: Job 2
            - field: totals
              label: Totals
            - field: saved
              label: Saved
            - field: swap
              label: Library
            - field: pilot
              label: Pilot
            - field: workers
              label: Workers
            - field: updated
              label: Updated
- Media:

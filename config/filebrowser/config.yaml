# FileBrowser Quantum. Storage is READ-ONLY until the migration is finished (user, Nov 8).
# Nov 15: source moved from /storage/disk1 to the /data pool (the container has mounted /data since Nov 13).
# After round 5: make the /data mount read-write in compose.yaml (see SWITCHOVER-PLAN.md).
server:
  sources:
    - path: "/storage/data"
      name: "Media pool (/data, read-only during migration)"
      config:
        defaultEnabled: true
    - path: "/storage/scratch"
      name: "scratch (NVMe, read-only)"
      config:
        defaultEnabled: true
auth:
  methods:
    password:
      enabled: true
      signup: false
      minLength: 12

# FileBrowser Quantum. /data pool read-write since Nov 16 (migration finished); scratch stays read-only.
# Nov 15: source moved from /storage/disk1 to the /data pool (the container has mounted /data since Nov 13).
server:
  sources:
    - path: "/storage/data"
      name: "Media pool (/data)"
      config:
        defaultEnabled: true
    - path: "/storage/scratch"
      name: "scratch (NVMe, read-only)"
      config:
        defaultEnabled: true
auth:
  methods:
    password:
      enabled: true
      signup: false
      minLength: 12

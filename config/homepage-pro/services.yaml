      - type: customapi
        url: "http://bazarr:6767/api/system/status"
        headers:
          X-API-KEY: "{{HOMEPAGE_VAR_BAZARR_KEY}}"
        refreshInterval: 3600000
        mappings:
        - field: data.bazarr_version
          label: Version
        - field: data.start_time
          label: Started
          scale: 1000
          format: relativeDate
          style: short
          numeric: auto

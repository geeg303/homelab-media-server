        url: "http://192.0.2.242:61208"
        version: 4
        metric: "sensor:CPU Fan"
        chart: true
  - Core 20 (hottest):
      icon: mdi-thermometer-high
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: "sensor:Core 20"

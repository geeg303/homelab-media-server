# =====================================================================================
# TAB: Network
# =====================================================================================
- WAN & Gateway:
  - Gateway:
      href: "https://192.0.2.1"
      icon: unifi.png
      description: UniFi Dream Router 7 · uptime, WAN state, client counts
      widget:
        type: unifi
        url: "https://192.0.2.1"
        site: Default
        key: "{{HOMEPAGE_VAR_UNIFI_KEY}}"
        fields:
        - uptime
        - wan
        - wlan_users
        - lan_users
  - WAN link:
      href: "https://192.0.2.1"
      icon: mdi-web
      description: live throughput, latency, last speedtest, drops
      widget:
        type: customapi
        url: "https://192.0.2.1/proxy/network/api/stat/sites"
        headers:
          X-API-KEY: "{{HOMEPAGE_VAR_UNIFI_KEY}}"
          Accept: application/json
        refreshInterval: 15000
        display: list
        mappings:
        - field: data.0.health.1.isp_name
          label: ISP
        - field: data.0.health.1.rx_bytes-r
          label: Down
          format: bitrate
          scale: 8
        - field: data.0.health.1.tx_bytes-r
          label: Up
          format: bitrate
          scale: 8
        - field: data.0.health.2.latency
          label: Latency
          suffix: ms
        - field: data.0.health.2.xput_down
          label: Speedtest down
          format: float
          suffix: Mbps
        - field: data.0.health.2.xput_up
          label: Speedtest up
          format: float
          suffix: Mbps

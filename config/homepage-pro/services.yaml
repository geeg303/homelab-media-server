        chart: false

- GPU & Processes:
  - iGPU (Quick Sync):
      icon: mdi-expansion-card-variant
      description: Intel UHD 770 via Glances · engine busy % (mem/temp not exposed)
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: "gpu:intel0"
        chart: true
  - Process table:
      icon: mdi-counter
      description: Glances processcount
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/processcount"
        refreshInterval: 15000
        mappings:
        - field: total
          label: Processes
          format: number
        - field: running
          label: Running
          format: number
        - field: sleeping
          label: Sleeping
          format: number
        - field: thread
          label: Threads
          format: number

- Containers:
  - Docker engine:
      href: "http://192.0.2.242:5001"
      icon: mdi-docker
      description: running/total, healthchecks, restart counts (eng-status)
      widget:
        type: customapi
        url: "http://status/eng.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: containers
          label: Running
        - field: docker_health
          label: Healthchecks
        - field: docker_restarts
          label: Restarts
        - field: docker_version
          label: Engine
  - Container CPU:
      icon: mdi-chip
      description: per-container CPU % (Glances /api/4/containers)
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/containers"
        refreshInterval: 15000
        display: dynamic-list
        mappings:
          name: name
          label: cpu_percent
          format: float
          suffix: "%"
          limit: 30
  - Container memory:
      icon: mdi-memory
      description: per-container resident memory
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/containers"
        refreshInterval: 30000
        display: dynamic-list
        mappings:
          name: name
          label: memory_usage
          format: bytes
          limit: 30
  - Container state:
      href: "http://192.0.2.242:5001"
      icon: mdi-ship-wheel
      description: engine state per container · manage in Dockge
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/containers"
        refreshInterval: 30000
        display: dynamic-list
        mappings:
          name: name
          label: status
          limit: 30


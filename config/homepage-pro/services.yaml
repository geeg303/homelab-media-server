# Homepage "Pro" view (box · operations, :3010). Engineering IA, Nov 13 2026.
# Tabs/groups: see settings.yaml layout. Rationale per tile: README.md.
# Secrets: same {{HOMEPAGE_VAR_*}} names as the :3000 instance (homepage.env); nothing new required.
# Hostnames: container names on the `media` network (homepage-pro is attached), Glances/Plex/PrismCast via 192.0.2.242.
# Calendar tiles reference group "Acquisition" + services "Sonarr"/"Radarr": rename together or events disappear.
# Plex native widget is LIVE (un-parked Nov 13 2026 once real libraries existed: TV Shows = section 1, Movies = section 2).
#   It talks to Plex directly (http://192.0.2.242:32400, {{HOMEPAGE_VAR_PLEX_TOKEN}}); extra library detail comes from Tautulli get_library.

# =====================================================================================
# TAB: Overview
# =====================================================================================
- Service Health:
  - Availability:
      href: "http://192.0.2.242:3001/status/box"
      icon: uptime-kuma.png
      description: Uptime Kuma status page 'box' · monitors up/down, 24 h uptime, open incident
      widget:
        type: uptimekuma
        url: "http://uptime-kuma:3001"
        slug: box
        fields:
        - up
        - down
        - uptime
        - incident
  - Host checks (24 h):
      href: "http://192.0.2.242:3001/status/box"
      icon: mdi-heart-pulse
      description: Kuma push/host checks · 24 h availability per check
      widget:
        type: customapi
        url: "http://uptime-kuma:3001/api/status-page/heartbeat/box"
        refreshInterval: 60000
        display: list
        mappings:
        - field: uptimeList.36_24
          label: Disk space
          format: percent
          scale: 100
        - field: uptimeList.37_24
          label: SMART
          format: percent
          scale: 100
        - field: uptimeList.38_24
          label: Drives present (10)
          format: percent
          scale: 100
        - field: uptimeList.45_24
          label: USB watchdog
          format: percent
          scale: 100
        - field: uptimeList.40_24
          label: iGPU (no hangs)
          format: percent
          scale: 100
        - field: uptimeList.44_24
          label: Status feed fresh
          format: percent
          scale: 100
        - field: uptimeList.25_24
          label: Config backup
          format: percent
          scale: 100
  - Threshold alerts:
      href: "http://192.0.2.242:61208"
      icon: mdi-alert-octagon-outline
      description: Glances alert log (CPU/mem/load/fs/sensor thresholds) · empty list = no alerts
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/alert"
        refreshInterval: 30000
        display: dynamic-list
        mappings:
          name: type
          label: state
          limit: 6
  # eng.json is written by eng-status.timer (parts/telemetry, lead installs). Until installed this tile shows an API error.
  - Engineering status:
      icon: mdi-clipboard-pulse-outline
      description: host invariants · systemd, scheduled jobs, SMART, Docker, apt, reboot (eng-status)
      widget:
        type: customapi
        url: "http://status/eng.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: overall
          label: Overall
        - field: failed_units
          label: Failed units
        - field: units_summary
          label: Scheduled jobs
        - field: smart_summary
          label: SMART
        - field: docker_health
          label: Containers
        - field: apt
          label: Updates
        - field: reboot
          label: Reboot
        - field: updated
          label: Sampled

- Key Metrics:
  - Host:
      href: "http://192.0.2.242:61208"
      icon: mdi-server
      description: i5-14500 · 20 threads · 32 GB · Ubuntu 26.04 · sampled every 2 min
      widget:
        type: customapi
        url: "http://status/host.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: uptime
          label: Uptime
        - field: load
          label: Load 1/5/15
        - field: memory
          label: Memory
        - field: containers
          label: Containers
        - field: failed_units
          label: Failed units
  - CPU:
      href: "http://192.0.2.242:61208"
      icon: mdi-cpu-64-bit
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: cpu
        chart: true
        chartMin: 0
        chartMax: 100
        pointsLimit: 30
        refreshInterval: 5000
  - Memory:
      href: "http://192.0.2.242:61208"
      icon: mdi-memory
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: memory
        chart: true
        pointsLimit: 30
  - Storage:
      icon: mdi-database
      description: df fill, data array and NVMe · dash-status, every 2 min
      widget:
        type: customapi
        url: "http://status/disks.json"
        refreshInterval: 120000
        display: list
        mappings:
        - field: array_total
          label: Data array
        - field: root
          label: OS NVMe
        - field: scratch
          label: Scratch NVMe
        - field: updated
          label: Sampled
  - WAN:
      href: "https://192.0.2.1"
      icon: mdi-web
      description: UniFi gateway · Google Fiber · live rate, latency, last speedtest
      widget:
        type: customapi
        url: "https://192.0.2.1/proxy/network/api/stat/sites"
        headers:
          X-API-KEY: "{{HOMEPAGE_VAR_UNIFI_KEY}}"
          Accept: application/json
        refreshInterval: 15000
        display: list
        mappings:
        - field: data.0.health.1.rx_bytes-r
          label: Down
          format: bitrate
          scale: 8
        - field: data.0.health.1.tx_bytes-r
          label: Up
          format: bitrate
          scale: 8
        - field: data.0.health.2.latency
          label: Latency
          suffix: ms
        - field: data.0.health.2.drops
          label: WAN drops
          format: number

- Active Jobs:
  - Disk migration:
      href: /#pipelines
      target: _self
      icon: mdi-harddisk-plus
      description: NTFS → ext4, one disk per round · copy, checksum verify, overall
      widget:
        type: customapi
        url: "http://status/migration.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: round
          label: Round
        - field: stage
          label: Stage
        - field: overall_bar
          label: Overall
        - field: eta
          label: ETA
        - field: health
          label: Health
  - Transcode:
      href: /#pipelines
      target: _self
      icon: tdarr.png
      description: Tdarr HEVC/QSV · queue, results, library swap
      widget:
        type: customapi
        url: "http://status/tdarr.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: now
          label: State
        - field: totals
          label: Totals
        - field: saved
          label: Saved
        - field: swap
          label: Swap
  - Downloads:
      href: "http://192.0.2.242:8080"
      icon: sabnzbd.png
      description: SABnzbd · current rate, queue depth, time left
      widget:
        type: sabnzbd
        url: "http://sabnzbd:8080"
        key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
        fields:
        - rate
        - queue
        - timeleft
  - Image updates:
      href: "http://192.0.2.242:3002"
      icon: whats-up-docker.png
      description: What's Up Docker · images watched, newer tags available (apply with docker-update-all)
      widget:
        type: whatsupdocker
        url: "http://wud:3000"
        username: "{{HOMEPAGE_VAR_WUD_USER}}"
        password: "{{HOMEPAGE_VAR_WUD_PASSWORD}}"
        fields:
        - monitoring
        - updates

# =====================================================================================
# TAB: Compute
# =====================================================================================
- CPU & Memory:
  - System:
      href: "http://192.0.2.242:61208"
      icon: mdi-desktop-tower
      description: Glances 4 · host identity, CPU/mem/swap
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: info
        chart: false
  - CPU utilisation:
      icon: mdi-cpu-64-bit
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: cpu
        chart: true
        chartMin: 0
        chartMax: 100
        pointsLimit: 30
        refreshInterval: 3000
  - Memory:
      icon: mdi-memory
      widget:
        type: glances
        url: "http://192.0.2.242:61208"
        version: 4
        metric: memory
        chart: true
        pointsLimit: 30
  - Load average:
      icon: mdi-chart-bell-curve-cumulative
      description: run-queue length · 20 logical CPUs
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/load"
        refreshInterval: 10000
        mappings:
        - field: min1
          label: 1 min
          format: float
        - field: min5
          label: 5 min
          format: float
        - field: min15
          label: 15 min
          format: float
        - field: cpucore
          label: CPUs
          format: number
  - Utilisation summary:
      icon: mdi-gauge
      description: Glances quicklook · clock, CPU, RAM, swap, normalised load
      widget:
        type: customapi
        url: "http://192.0.2.242:61208/api/4/quicklook"
        refreshInterval: 10000
        display: list
        mappings:
        - field: cpu_hz_current
          label: Clock
          format: float
          scale: 1.0e-09
          suffix: GHz
        - field: cpu
          label: CPU
          format: percent
        - field: mem
          label: RAM
          format: percent
        - field: swap
          label: Swap
          format: percent
        - field: load
          label: Load / cores
          format: percent
  - Pressure (PSI):
      icon: mdi-gauge-full
      description: Linux pressure stall info · % time tasks stalled (60 s), top CPU consumers
      widget:
        type: customapi
        url: "http://status/eng.json"
        refreshInterval: 60000
        display: list
        mappings:
        - field: cpu_pressure
          label: CPU stall
        - field: memory_pressure
          label: Memory stall
        - field: io_pressure
          label: I/O stall
        - field: load
          label: Load
        - field: top_cpu_display
          label: Top CPU
  - Host software:
      icon: mdi-linux
      description: OS, kernel, container engine, pending packages (eng-status)
      widget:
        type: customapi
        url: "http://status/eng.json"
        refreshInterval: 300000
        display: list
        mappings:
        - field: os
          label: OS
        - field: kernel
          label: Kernel
        - field: docker_version
          label: Docker
        - field: uptime
          label: Uptime
        - field: apt
          label: apt
          additionalField:
            field: apt_checked
            color: theme
        - field: reboot
          label: Reboot

- Thermals:
